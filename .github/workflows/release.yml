# On a version tag: publish the WebApi and the SignalR service for linux-x64
# (framework-dependent, the host has the ASP.NET Core 10 runtime), sign each
# tarball keyless with cosign (Sigstore) under this workflow's identity, and
# publish them as a GitHub release. The estate's deploy (innonova/iac)
# verifies the bundle against this repository and workflow before installing.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # create the release
  id-token: write   # keyless signing
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "10.0.x" }
      - name: publish
        run: |
          for p in WebApi:mimiri-webapi SignalR:mimiri-signalr; do
            proj="${p%%:*}"; name="${p##*:}"
            dotnet publish "Mimer.Notes.$proj/Mimer.Notes.$proj.csproj" -c Release -r linux-x64 --self-contained false -o "out/$name" -p:Version="${GITHUB_REF_NAME#v}"
            rm -f "out/$name"/appsettings.Development.json
            tar -C "out/$name" -czf "$name-linux-x64.tar.gz" .
            sha256sum "$name-linux-x64.tar.gz" > "$name-linux-x64.tar.gz.sha256"
          done
      - uses: sigstore/cosign-installer@v4
      - name: sign
        run: |
          for name in mimiri-webapi mimiri-signalr; do
            cosign sign-blob --yes --bundle "$name-linux-x64.tar.gz.sigstore.json" "$name-linux-x64.tar.gz"
          done
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "mimiri-server $GITHUB_REF_NAME" mimiri-*-linux-x64.tar.gz*
